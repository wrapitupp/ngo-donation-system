notes-after-punctuation: true

# All headings black, including the ToC, List of Figures, List of Tables and
# every internal cross-reference. hyperref would otherwise colour these, and
# they read as headings on the page.
colorlinks: true
linkcolor: black
citecolor: black
urlcolor: black
filecolor: black
toccolor: black

# Numbering and structure.
#
# numbersections is deliberately OFF. Decision D2 mirrors the department
# template exactly, gaps included: there is no 1.5, no 3.5, no 6.4, no 6.6.
# Pandoc's auto-numbering would silently renumber 1.6 to 1.5 and destroy the
# match with the marking rubric. Section numbers are literal text in each
# heading instead, and every heading is marked unnumbered.
# toc/lof/lot are deliberately OFF here. Pandoc pins them immediately after
# the title block, which puts them ahead of the declaration and certification
# pages. 00-preliminaries.md emits \tableofcontents, \listoffigures and
# \listoftables at the correct point in the department's page order instead.
toc: false
toc-depth: 3
numbersections: false
