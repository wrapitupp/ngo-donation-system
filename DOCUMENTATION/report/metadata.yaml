# report class, not article: the report is organised in chapters, and both
# \chapter and \counterwithin{figure}{chapter} require it. Note that report
# does NOT provide \frontmatter or \mainmatter, which are book-class only,
# so 00-preliminaries.md switches page numbering with \pagenumbering.
documentclass: report

# Typography. Confirm with supervisor (open item O8).
mainfont: "Times New Roman"
